kind = "web"
previewPath = "/"
title = "MIDAS"
description = "A polished landing page for MIDAS, a research navigation platform that helps first-time researchers turn ideas into clear, step-by-step roadmaps."
version = "1.0.0"
id = "artifacts/midas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19837

[services.development]
run = "pnpm --filter @workspace/midas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/midas", "run", "build" ]
serve = "static"
publicDir = "artifacts/midas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19837"
BASE_PATH = "/"
